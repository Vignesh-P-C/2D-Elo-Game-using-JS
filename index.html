<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCENT</title>
  <h1>2D Combat Game</h1>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start Screen -->
  <div id="startScreen">
    <div class="stars" id="starsLayer"></div>
    <div class="start-content">
      <div class="game-title">
        <span class="title-main">2D</span><span class="title-elo">ELO</span>
      </div>
      <p class="title-sub">COMBAT ARENA</p>
      <div class="title-divider"></div>
      <button id="playBtn">▶&nbsp;&nbsp;PLAY</button>
      <p class="controls-hint">Move: A/D &nbsp;|&nbsp; Jump: W / Space &nbsp;|&nbsp; Attack: Left Click &nbsp;|&nbsp; Dash: Right Click</p>
    </div>
  </div>

  <canvas id="gameCanvas" style="display:none;"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
